<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candle Blow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css"
    />
    <link rel="stylesheet" href="./cake-style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prefixfree/1.0.7/prefixfree.min.js"></script>
  </head>
  <body>
    <div class="candle-count-display">
      Candles on the Cake: <span id="candleCount">0</span>
    </div>
    <div class="cake">
      <div class="plate"></div>
      <div class="layer layer-bottom"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-top"></div>
      <div class="icing"></div>
      <div class="drip drip1"></div>
      <div class="drip drip2"></div>
      <div class="drip drip3"></div>
    </div><div id="birthday-wish" style="display:none; text-align:center; margin-top: 50px;">
    <h1 style="color: #ff4d6d; font-size: 50px;">🎂 Happy Birthday! 🎂</h1>
    <p style="font-size: 20px;">I love you so much! ❤️</p>
</div>
<div id="birthday-message" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; text-align: center;">
    <h1 style="font-size: 3.5rem; margin-bottom: 10px; animation: popUp 1s ease-out;">Happy Birthday! ✨</h1>
    <p style="font-size: 1.5rem; color: #ff4d6d;">Wishing you all the best, is just small gift Come telegram......</p>

  </div>

<style>
@keyframes popUp {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
    <script src="cake-script.js"></script>
  </body>
</html>
